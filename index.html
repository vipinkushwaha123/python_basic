<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-blue-500 to-cyan-400 min-h-screen">

    <div class="container mx-auto px-4 py-8">

        <!-- Heading -->
        <h1 class="text-4xl font-bold text-center text-white mb-8">
            🌤 Weather Forecast App
        </h1>

        <!-- Search Box -->
        <div class="bg-white rounded-xl shadow-lg p-6">

            <div class="flex flex-col md:flex-row gap-4">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter City Name..."
                    class="flex-1 border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                <button
                    id="searchBtn"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                    Search
                </button>

                <button
                    id="locationBtn"
                    class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700">
                    Current Location
                </button>

            </div>

            <!-- Recent Searches -->
            <div class="mt-4">

                <select
                    id="recentCities"
                    class="hidden border rounded-lg px-4 py-3 w-full">

                    <option>Select Recent City</option>

                </select>

            </div>

        </div>

        <!-- Error Message -->

        <div
            id="errorBox"
            class="hidden mt-5 bg-red-500 text-white p-4 rounded-lg">

        </div>

        <!-- Current Weather -->

        <div
            id="weatherCard"
            class="hidden mt-8 bg-white rounded-xl shadow-xl p-6">

            <div class="flex justify-between items-center">

                <div>

                    <h2
                        id="cityName"
                        class="text-3xl font-bold">
                    </h2>

                    <p
                        id="weatherDescription"
                        class="text-gray-600">
                    </p>

                </div>

                <img
                    id="weatherIcon"
                    src=""
                    alt=""
                    class="w-24">

            </div>

            <div class="mt-6 grid md:grid-cols-4 gap-5">

                <div class="bg-blue-100 p-5 rounded-lg text-center">

                    <i class="fa-solid fa-temperature-half text-2xl"></i>

                    <h3 class="font-bold mt-2">
                        Temperature
                    </h3>

                    <p
                        id="temperature"
                        class="text-2xl font-bold">
                    </p>

                </div>

                <div class="bg-green-100 p-5 rounded-lg text-center">

                    <i class="fa-solid fa-droplet text-2xl"></i>

                    <h3 class="font-bold mt-2">
                        Humidity
                    </h3>

                    <p
                        id="humidity"
                        class="text-xl">
                    </p>

                </div>

                <div class="bg-yellow-100 p-5 rounded-lg text-center">

                    <i class="fa-solid fa-wind text-2xl"></i>

                    <h3 class="font-bold mt-2">
                        Wind
                    </h3>

                    <p
                        id="wind"
                        class="text-xl">
                    </p>

                </div>

                <div class="bg-purple-100 p-5 rounded-lg text-center">

                    <button
                        id="toggleUnit"
                        class="bg-purple-600 text-white px-5 py-2 rounded-lg">

                        °C / °F

                    </button>

                </div>

            </div>

        </div>

        <!-- Weather Alert -->

        <div
            id="alertBox"
            class="hidden mt-5 bg-orange-500 text-white p-4 rounded-lg">

        </div>

        <!-- 5 Day Forecast -->

        <div class="mt-10">

            <h2
                class="text-3xl text-white font-bold mb-5">

                5 Day Forecast

            </h2>

            <div
                id="forecastCards"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-5">

            </div>

        </div>

    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
